name: Plan Multi Environments 2

on:
  push:
    branches: [ feat-wf-dispatch ]
  pull_request:

jobs:
  terraform-plan:
    name: Terraform Plan - ${{ matrix.env }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - path: dev
            env: dev01
          - path: dev
            env: dev02
          - path: dev
            env: dev03
          - path: stg
            env: stg01
          - path: stg
            env: stg02

    defaults:
      run:
        working-directory: core/${{ matrix.path }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan (${{ matrix.env }})
        run: |
          terraform plan \
            -input=false \
            -var-file=tfvars/${{ matrix.env }}.tfvars
