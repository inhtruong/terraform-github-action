name: Terraform CI Demo

on:
  workflow_dispatch:
    inputs:
      FAIL_PLAN:
        description: "Set true to simulate failure"
        required: true
        default: "false"
      FAIL_APPLY:
        description: "Set true to simulate failure"
        required: true
        default: "false"

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      FAIL_PLAN: ${{ github.event.inputs.FAIL_PLAN }}
      FAIL_APPLY: ${{ github.event.inputs.FAIL_APPLY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      # -------- PLAN --------
      - name: Terraform Plan (Demo)
        id: plan
        run: |
          echo "Running terraform plan..."

          if [ "$FAIL_PLAN" = "true" ]; then
            echo "Simulating terraform plan failure"
            echo "plan_status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "Terraform plan success"
          echo "plan_status=success" >> $GITHUB_OUTPUT

        continue-on-error: true

      # -------- APPLY --------
      - name: Terraform Apply (Demo)
        id: apply
        if: steps.plan.outputs.plan_status == 'success'
        run: |
          echo "Running terraform apply..."

          if [ "$FAIL_APPLY" = "true" ]; then
            echo "Simulating terraform apply failure"
            echo "apply_status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "Terraform apply success"
          echo "apply_status=success" >> $GITHUB_OUTPUT

        continue-on-error: true

      # -------- DEBUG OUTPUT --------
      - name: Show Outputs
        run: |
          echo "Plan status: ${{ steps.plan.outputs.plan_status }}"
          echo "Apply status: ${{ steps.apply.outputs.apply_status }}"

      # -------- FAILURE HANDLER --------
      - name: Notify Failure
        if: steps.plan.outputs.plan_status == 'failure' || steps.apply.outputs.apply_status == 'failure'
        run: |
          echo "Detected failure - push custom metric here"
