

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Select environment to plan"
        type: choice
        required: true
        options:
          - dev01
          - dev02
          - dev03
          - stg01
          - stg02

jobs:
  terraform-plan:
    name: Terraform Plan - ${{ inputs.target_env }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      # 🔁 Map env -> path (dev / stg)
      - name: Resolve environment path
        id: resolve
        run: |
          if [[ "${{ inputs.target_env }}" == dev* ]]; then
            echo "path=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.target_env }}" == stg* ]]; then
            echo "path=stg" >> $GITHUB_OUTPUT
          else
            echo "Unknown environment"
            exit 1
          fi

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: core/${{ steps.resolve.outputs.path }}

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -var-file=tfvars/${{ inputs.target_env }}.tfvars
        working-directory: core/${{ steps.resolve.outputs.path }}
