name: Terraform Plan Reusable

on:
  workflow_call:
    inputs:
      env-id:
        description: 'ID của môi trường'
        required: true
        type: string
      status_plan:
        description: 'Trạng thái giả lập của plan (success/fail)'
        required: false
        default: 'success'
        type: string
    # QUAN TRỌNG: Cần khai báo outputs ở đây để workflow cha có thể thấy
    outputs:
      plan-outcome:
        description: "Trả về OK hoặc NG"
        value: ${{ jobs.terraform-plan.outputs.outcome }}

jobs:
  terraform-plan:
    name: TF Plan - ${{ inputs.env-id }}
    runs-on: ubuntu-latest
    # environment: ${{ inputs.env-id }} # Mở ra nếu bạn đã tạo Environment trong Repo Settings
    
    # Map output từ cấp độ Step lên cấp độ Job
    outputs:
      outcome: ${{ steps.set-status.outputs.final_status }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Check Status and Set Output
        id: set-status
        shell: bash
        run: |
          if [ "${{ inputs.status_plan }}" == "success" ]; then
            echo "final_status=OK" >> $GITHUB_OUTPUT
            echo "### Terraform Plan Result: OK 🚀" >> $GITHUB_STEP_SUMMARY
          else
            echo "final_status=NG" >> $GITHUB_OUTPUT
            echo "### Terraform Plan Result: NG ❌" >> $GITHUB_STEP_SUMMARY
          fi

      # --- Các bước Terraform thực tế (tạm thời comment) ---
      # - name: Terraform Init
      #   run: terraform init -backend-config="env/${{ inputs.env-id }}/backend.tfvars"
      # - name: Terraform Plan
      #   run: terraform plan -var-file="env/${{ inputs.env-id }}/terraform.tfvars"