name: Terraform Plan (Composite Resolve)

on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        required: true
        options:
          - account
          - group
          - environment
      target_env:
        type: choice
        required: true
        options:
          - devel
          - prod
          - red
          - dev
          - stg
          - prd
          - red02
          - dev01
          - stg02
          - prd1
          - stg1

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 🔹 Resolve env via composite action
      - name: Resolve terraform context
        id: resolve
        uses: ./.github/actions/resolve-env
        with:
          scope: ${{ inputs.scope }}
          target_env: ${{ inputs.target_env }}

      # 🔹 Print resolved values (debug)
      - name: Print resolved outputs
        run: |
          echo "========== RESOLVED =========="
          echo "Workdir : ${{ steps.resolve.outputs.workdir }}"
          echo "Env ID  : ${{ steps.resolve.outputs.env_id }}"
          echo "Runner  : ${{ steps.resolve.outputs.runner }}"
          echo "Is Prod : ${{ steps.resolve.outputs.is_prod }}"
          echo "=============================="

      # 🔹 Call reusable workflow
      - name: Terraform Plan
        uses: ./.github/workflows/workflow-terraform-plan.yml
        with:
          workdir:  ${{ steps.resolve.outputs.workdir }}
          env-id:   ${{ steps.resolve.outputs.env_id }}
          runner:   ${{ steps.resolve.outputs.runner }}
          is_prod:  ${{ steps.resolve.outputs.is_prod }}
