name: Terraform Plan (multi-scope) - DEBUG

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Select scope level"
        type: choice
        required: true
        options:
          - account
          - group
          - environment

      target_env:
        description: "Select environment"
        type: choice
        required: true
        options:
          - devel
          - prod
          - red
          - dev
          - stg
          - prd
          - red02
          - dev01
          - stg02
          - prd1
          - stg1

jobs:
  debug-plan:
    name: Debug - ${{ inputs.scope }} / ${{ inputs.target_env }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 🔎 Resolve working directory & tfvars (SAFE)
      - name: Resolve terraform path (print only)
        id: resolve
        run: |
          SCOPE="${{ inputs.scope }}"
          ENV="${{ inputs.target_env }}"

          WORKDIR=""
          TFVARS=""

          case "$SCOPE" in
            account)
              if [[ "$ENV" =~ ^(devel|prod)$ ]]; then
                WORKDIR="account/envs/$ENV"
                TFVARS="(none)"
              else
                echo "❌ ENV '$ENV' is NOT valid for scope 'account'"
                exit 1
              fi
              ;;
              
            group)
              if [[ "$ENV" =~ ^(red|dev|stg)$ ]]; then
                WORKDIR="group/envs/devel"
                TFVARS="tfvars/$ENV.tfvars"
              elif [[ "$ENV" =~ ^(prd)$ ]]; then
                WORKDIR="group/envs/prod"
                TFVARS="tfvars/$ENV.tfvars"
              else
                echo "❌ ENV '$ENV' is NOT valid for scope 'group'"
                exit 1
              fi
              ;;
              
            environment)
              if [[ "$ENV" =~ ^(red02|dev01|stg02)$ ]]; then
                WORKDIR="environment/envs/devel"
                TFVARS="tfvars/$ENV.tfvars"
              elif [[ "$ENV" =~ ^(prd1|stg1)$ ]]; then
                WORKDIR="environment/envs/prod"
                TFVARS="tfvars/$ENV.tfvars"
              else
                echo "❌ ENV '$ENV' is NOT valid for scope 'environment'"
                exit 1
              fi
              ;;
              
            *)
              echo "❌ Unknown scope"
              exit 1
              ;;
          esac

      # 🖨️ Print result
      - name: Print resolved values
        run: |
          echo "================================="
          echo "Scope      : ${{ inputs.scope }}"
          echo "Target Env : ${{ inputs.target_env }}"
          echo "Workdir    : ${{ steps.resolve.outputs.workdir }}"
          echo "TFVARS     : ${{ steps.resolve.outputs.tfvars }}"
          echo "================================="
