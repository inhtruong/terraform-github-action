name: Main Infrastructure CI

on:
  push:
    branches:
      - 'deploy/dev01'
      - 'deploy/dev02'

jobs:
  # Job 1: Trích xuất Environment ID từ tên nhánh (dev01 hoặc dev02)
  prep-env:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.get-env.outputs.ENV_ID }}
    steps:
      - name: Extract Branch Name
        id: get-env
        shell: bash
        run: |
          # GITHUB_REF_NAME có giá trị ví dụ: deploy/dev01
          BRANCH_NAME="${{ github.ref_name }}"
          ENV_ID=$(echo $BRANCH_NAME | cut -d'/' -f2)
          echo "ENV_ID=$ENV_ID" >> $GITHUB_OUTPUT
          echo "### 🌐 Target Environment: $ENV_ID" >> $GITHUB_STEP_SUMMARY

  # Job 2: Gọi workflow con (Reusable Workflow)
  call-tf-plan:
    needs: prep-env
    uses: ./.github/workflows/tf-plan-reusable.yml
    with:
      env-id: ${{ needs.prep-env.outputs.env_name }}
      status_plan: 'success' # Bạn có thể đổi thành 'fail' để test case NG

  # Job 3: Xử lý dựa trên kết quả trả về (OK/NG)
  check-result:
    needs: [prep-env, call-tf-plan]
    runs-on: ubuntu-latest
    steps:
      - name: Final Report
        run: |
          echo "Môi trường thực thi: ${{ needs.prep-env.outputs.env_name }}"
          # SỬA TẠI ĐÂY: Sử dụng 'plan-outcome' như đã khai báo ở workflow con
          echo "Kết quả từ Plan: ${{ needs.call-tf-plan.outputs.plan-outcome }}"
          
      - name: Execution Logic
        # SỬA TẠI ĐÂY: Logic check khớp với output trả về
        if: ${{ needs.call-tf-plan.outputs.plan-outcome == 'OK' }}
        run: |
          echo "Trạng thái OK. Đang khởi tạo tiến trình Deploy cho ${{ needs.prep-env.outputs.env_name }}..."
          # Tại đây bạn có thể gọi thêm các bước deploy thực tế

      - name: Alert if NG
        if: ${{ needs.call-tf-plan.outputs.plan-outcome == 'NG' }}
        run: |
          echo "Cảnh báo: Plan thất bại (NGx). Dừng workflow tại đây."
          exit 1