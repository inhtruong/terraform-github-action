name: Scheduled Sync Develop to Dev Branches

on:
  workflow_dispatch:

# THÊM ĐOẠN NÀY VÀO
permissions:
  contents: write

jobs:
  force-push:
    name: Push to ${{ matrix.target_branch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_branch: ['deploy/dev01', 'deploy/dev02']
      fail-fast: false

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Force Push to Target Branch
        run: |
          echo "Đang thực hiện tự động force push..."
          git push origin develop:${{ matrix.target_branch }} --force