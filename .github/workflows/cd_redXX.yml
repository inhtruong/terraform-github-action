name: Call Terraform Apply (Matrix) red

on:
  workflow_dispatch:

jobs:
  call-apply:
    name: Call apply for ${{ matrix.env }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: red01
            apply_status: success
          - env: red02
            apply_status: fail
          - env: red03
            apply_status: fail

    uses: ./.github/workflows/terraform-apply-called.yml
    with:
      apply_status: ${{ matrix.apply_status }}
